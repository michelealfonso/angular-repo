<div class="flex flex-col items-center justify-start min-h-screen bg-gray-100 p-8 gap-8">

  <div class="w-full max-w-2xl bg-white p-6 rounded-lg shadow">
    <div class="w-full h-auto flex flex-col lg:flex-row gap-5">
      <input
        type="text"
        placeholder="Nome lista"
        [(ngModel)]="newListName"
        name="newListName"
        class="flex-1 px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
      />
      <button
        (click)="createList()"
        class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 transition"
      >
        Crea Lista
      </button>
    </div>
  </div>

<div class="flex flex-col gap-5">
  <div
    *ngFor="let list of lists"
    class="bg-white p-4 rounded-lg shadow-md flex flex-col gap-4"
  >
    <h3 class="text-lg font-semibold text-gray-800 text-center"> {{ list.name }} </h3>

    <div class="flex flex-col gap-5">
      <app-cards [listId]="list.id"></app-cards>
    </div>
  </div>
</div>

</div>
