<div class="relative flex justify-end items-center p-6">
  <button (click)="toggleDropdown()" class="p-0 border-none bg-transparent">
    <img [src]="avatarURL || 'assets/default-avatar.png'" alt="Foto profilo" class="w-12 h-12 rounded-full object-cover cursor-pointer" />
  </button>

  <!-- Dropdown -->
  <div *ngIf="showDropdown" class="absolute right-0 top-20 mt-2 w-40 bg-white shadow-md rounded-md z-10">
    <label class="block px-4 py-2 cursor-pointer hover:bg-gray-100">
      Cambia immagine
      <input #fileInput type="file" class="hidden" (change)="onFileSelected($event)" />
    </label>
    <button (click)="logout()" class="w-full text-left px-4 py-2 hover:bg-gray-100">
      Logout
    </button>
  </div>
</div>

<div>
  <app-boards></app-boards>
</div>
