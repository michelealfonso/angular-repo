<div class="flex items-center justify-center min-h-screen bg-gray-100">
  <div class="w-full max-w-sm bg-white rounded-lg shadow-md p-6">
    <h2 class="text-2xl font-semibold text-center mb-6">
      {{ mode === 'login' ? 'Accedi a Trello' : 'Crea un account' }}
    </h2>

    <form (ngSubmit)="submit()" class="flex flex-col gap-4">
      <input
        *ngIf="mode === 'register'"
        [(ngModel)]="username"
        name="username"
        type="text"
        required
        placeholder="Username"
        class="px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
      />

      <input
        [(ngModel)]="email"
        name="email"
        type="email"
        required
        placeholder="Email"
        class="px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
      />

      <input
        [(ngModel)]="password"
        name="password"
        type="password"
        required
        placeholder="Password"
        class="px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
      />

      <button
        type="submit"
        class="bg-blue-600 text-white py-2 rounded-md hover:bg-blue-700 transition-colors"
      >
        {{ mode === 'login' ? 'Accedi' : 'Registrati' }}
      </button>
    </form>

    <p *ngIf="message" class="text-green-600 mt-4 text-sm text-center">
      {{ message }}
    </p>
    <p *ngIf="error" class="text-red-600 mt-4 text-sm text-center">
      {{ error }}
    </p>

    <p class="mt-6 text-center text-sm text-gray-600">
      <a href="#" (click)="toggleMode(); $event.preventDefault()" class="text-blue-600 hover:underline">
        {{ mode === 'login' ? 'Non hai un account? Registrati' : 'Hai già un account? Accedi' }}
      </a>
    </p>
  </div>
</div>
