<div class="w-auto h-auto flex flex-col gap-5">
  <div class="mt-4 bg-gray-50 p-4 rounded-md border border-gray-200 shadow-sm">
    <h4 class="text-sm font-semibold text-gray-700 mb-2">Nuova Card</h4>

    <input
      type="text"
      [(ngModel)]="newCardName"
      placeholder="Titolo"
      class="w-full mb-2 px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
    />

    <textarea
      [(ngModel)]="newCardDescription"
      placeholder="Descrizione"
      class="w-full mb-2 px-3 py-2 border border-gray-300 rounded resize-none focus:outline-none focus:ring-2 focus:ring-blue-500"
      rows="2"
    ></textarea>

    <input
      type="date"
      [(ngModel)]="newDueDate"
      class="w-full mb-2 px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
    />

    <button
      (click)="createCard()"
      class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700 transition"
    >
      Aggiungi Card
    </button>
  </div>

  <div
    *ngFor="let card of cards"
    [ngStyle]="{
      'border-left': '4px solid ' + getStatusColor(card.status)
    }"
    class="flex flex-col gap-5 bg-white rounded-lg p-4 mb-4 shadow-md hover:shadow-lg transition-shadow duration-300"
  >
    <div *ngIf="!card.isEditing; else editMode">
      <div class="flex justify-between items-center">
        <h4 class="font-semibold text-xl text-gray-800 truncate">
          {{ card.title }}
        </h4>
        <span class="text-sm text-gray-500 italic">
          {{
            card.due_date
              ? (card.due_date | date : "dd/MM/yyyy")
              : "Nessuna scadenza"
          }}
        </span>
      </div>

      <p class="text-gray-600 mb-3">
        {{ card.description || "Nessuna descrizione" }}
      </p>

      <div class="flex justify-between items-center">
        <button
          (click)="toggleEdit(card)"
          class="text-sm text-blue-600 hover:text-blue-800 font-semibold"
        >
          Modifica
        </button>

        <button
          (click)="deleteCard(card)"
          class="text-sm text-red-600 hover:text-red-800 font-semibold"
        >
          Elimina
        </button>

        <button
          *ngIf="!card.is_done"
          (click)="markAsDone(card)"
          class="text-sm text-green-600 hover:text-green-800 font-semibold"
        >
          Segna come completata
        </button>

        <select
          [(ngModel)]="card.status"
          (change)="
            updateCard(
              card,
              card.title,
              card.description,
              card.due_date,
              card.status
            )
          "
          class="border border-gray-300 rounded px-2 py-1 text-sm"
        >
          <option value="pending">In sospeso</option>
          <option value="in_progress">In corso</option>
          <option value="done">Completato</option>
        </select>
      </div>
    </div>

    <ng-template #editMode>
      <div class="flex flex-col gap-3">
        <input
          [(ngModel)]="card.title"
          class="px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500 text-lg font-semibold text-gray-800"
          placeholder="Titolo card"
        />

        <textarea
          [(ngModel)]="card.description"
          rows="3"
          class="px-3 py-2 border border-gray-300 rounded resize-none focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-700"
          placeholder="Descrizione"
        ></textarea>

        <input
          type="date"
          [(ngModel)]="card.due_date"
          class="px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-700"
        />

        <div class="flex justify-end gap-2 mt-2">
          <button
            (click)="toggleEdit(card)"
            class="text-sm text-gray-500 hover:text-gray-700 px-4 py-2"
          >
            Annulla
          </button>

          <button
            (click)="
              updateCard(card, card.title, card.description, card.due_date);
              toggleEdit(card)
            "
            class="bg-green-600 hover:bg-green-700 text-white text-sm px-4 py-2 rounded transition"
          >
            Salva
          </button>
        </div>
      </div>
    </ng-template>
  </div>
</div>
