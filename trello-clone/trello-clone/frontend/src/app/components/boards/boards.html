<div class="p-6 bg-gray-100 min-h-screen">
  <div class="w-full h-auto flex flex-col justify-center items-center gap-8">
    <h2 class="text-2xl font-semibold text-gray-800">Le tue Boards</h2>

    <!-- Sezione di input -->
    <div class="w-full h-auto flex flex-col lg:flex-row gap-4">
      <input
        [(ngModel)]="newBoardName"
        type="text"
        placeholder="Nuova board"
        class="flex-1 px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-400"
      />
      <button
        (click)="addBoards()"
        class="px-5 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition"
      >
        Aggiungi
      </button>
    </div>

    <!-- Lista delle board come card -->
    <div class="w-full grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
      <div
        *ngFor="let board of boards"
        class="bg-white p-4 rounded-md shadow hover:shadow-lg transition cursor-pointer"
      >
        <span class="flex justify-center items-center text-lg font-medium text-gray-700"> {{ board.name }} </span>
          <app-lists [boardId]="board.id"></app-lists>
      </div>

    </div>
  </div>
</div>
