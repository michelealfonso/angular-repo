<div
  id="contact-section"
  class="
  relative
  w-full
  h-auto
  md:h-screen
  flex
  flex-col
  justify-center
  items-center
  pb-6
  gap-[50px]"
>
  <div class="relative z-50">
      <app-header title="Contact Me" description="Get in Touch"></app-header>
  </div>

  <div
    class="w-full md:w-full h-auto flex flex-col justify-center items-center gap-20"
  >
    <div
      *ngFor="let contact of contacts"
        class="
        border-right-radial-green
        relative
        w-auto
        flex
        flex-col
        md:flex-row
        justify-center
        items-center
        p-[30px]
        rounded-[2rem]
        gap-2"
      >
        <div class="w-full h-auto flex justify-center items-center gap-[10px]">
          <img
            class="w-[25px] h-[25px]"
            src="{{contact.icon}}"
          >
          <p
            (click)="openEmail()"
            class="text-[16px] md:text-[20px] text-zinc-200 font-semibold cursor-pointer">
            {{contact.email}}
          </p>
        </div>
    </div>

  </div>

</div >
