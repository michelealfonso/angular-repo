<div className="relative">
  <app-navbar></app-navbar>

  <div
    class="w-full h-auto md:h-screen flex flex-col md:flex-row justify-center items-center md:py-[100px] gap-[50px]"
  >
    <div class="flex flex-col justify-center items-center">
      <img
        class="w-[200px] h-[200px] md:w-[300px] md:h-[300px] rounded-full"
        [src]="profileImage"
        alt=""
      />
    </div>

    <div class="flex flex-col justify-center items-center gap-4">
      <span class="text-lg md:text-xl font-medium text-white">
        Hello, I am
      </span>
      <span
        class="text-2xl md:text-5xl font-bold bg-gradient-to-r from-[#1DB953] to-[#00b8ff] bg-clip-text text-transparent"
      >
        Michele Alfonso
      </span>

      <div class="w-[300px] h-10 flex justify-center items-center">
        <ngx-typed-js
          class="text-xl md:text-2xl font-bold text-white"
          [strings]="['Frontend Developer']"
          [shuffle]="true"
          [typeSpeed]="50"
          [backSpeed]="50"
          [loop]="true"
        >
          <span class="typing"></span>
        </ngx-typed-js>
      </div>
      <div class="flex justify-center items-center gap-4">
        <app-button-cv></app-button-cv>
        <app-button-info></app-button-info>
      </div>
      <div class="flex gap-5">
        <div
        *ngFor="let icon of icons"
        class="w-full h-auto flex justify-center items-center gap-5">
          <app-icon [iconSocial]="icon"></app-icon>
      </div>
      </div>
    </div>
  </div>
</div>
