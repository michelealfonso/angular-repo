<div class="w-[500px] bg-white p-10 rounded-lg shadow-lg hover:shadow-2xl transition duration-300">
  <div class="flex justify-evenly items-center">
    <h3 class="text-xl font-semibold text-center text-gray-800"> {{project.name}} </h3>
    <button
      (click)="onEditProject()"
      (mouseenter)="changeColorButton = true"
      (mouseleave)="changeColorButton = false"
      [ngStyle]="{ 'background-color': changeColorButton ? '#3182ce' : '#2b6cb0', 'color': changeColorButton ? 'white' : 'white' }">

         Modifica nome
      </button>
  </div>
  <p class="text-gray-500 mb-4"> </p>

  <app-task
  [tasks]="project.tasks"
  (addTask)="onAddTask($event)"
  (deleteTask)="onDeleteTask($event)"
  (editTask)="onEditTask($event)"
  >
  </app-task>

  <!-- Bottone per eliminare il progetto -->
  <button (click)="deleteProject()" class="mt-6 w-full py-2 bg-red-600 text-white font-semibold rounded-md hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-red-500 transition duration-200">
    Elimina Progetto
  </button>
</div>
