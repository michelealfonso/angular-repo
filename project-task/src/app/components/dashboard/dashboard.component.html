<nav class="w-full flex justify-between items-center p-10 bg-gradient-to-r from-gray-800 via-gray-900 to-black">
  <div class="">
    <p class="text-xl text-gray-300">Ciao, <span class="font-semibold text-blue-400"> Michele </span>!</p>
  </div>

  <button
    (click)="logout()"
    class="
    bg-red-600
    text-white
    font-semibold
    py-2
    px-4
    rounded-md
    hover:bg-red-700
    focus:outline-none
    focus:ring-2
    focus:ring-red-500
    transition duration-200">
    Logout
  </button>
</nav>

<div class="min-h-screen bg-gradient-to-r from-gray-800 via-gray-900 to-black text-white p-10">
  <div class="w-full mx-auto bg-gray-800 p-8 rounded-lg shadow-lg mt-8">
    <h2 class="text-3xl font-bold text-center text-white mb-6"> Progetti </h2>

    <div class="w-full flex flex-col lg:flex-row justify-center items-center gap-5">
      <label for="projectName" class="text-sm text-gray-300">Nome progetto: </label>
      <input type="text" id="projectName" [(ngModel)]="newProjectName" class="bg-gray-700 text-white border border-gray-600 p-2 rounded-md" />
      <button (click)="addProject()" class="py-2 px-4 bg-blue-600 text-white font-semibold rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 transition duration-200">
        Aggiungi Progetto
      </button>
    </div>

    <div class="w-full h-auto flex flex-wrap justify-center items-center p-20">
      <h3 class="text-2xl font-semibold w-full text-center mb-4">Lista dei progetti</h3>
    </div>

    <div class="w-full h-auto flex flex-col lg:flex-row justify-center items-center gap-10">
        <li *ngFor="let project of projects" class="w-full flex justify-center items-center">
          <app-project
            [project]="project"
            (nameUpdated)="updateProjectName($event, project.id)"
            (delete)="deleteProject($event)">
          </app-project>
        </li>
    </div>
  </div>
